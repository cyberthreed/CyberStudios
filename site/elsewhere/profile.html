<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Elsewhere Profile</title>
  <meta name="description" content="An Elsewhere profile: one identity, infinite ways to make it yours.">
  <link rel="icon" href="../elsewhere-accounts/butterfly.png" type="image/png">
  <link rel="stylesheet" href="profile-render.css?v=3">
  <style>
    html, body { margin: 0; min-height: 100%; background: #2f8fe0 url("../assets/elsewhere-desktop.webp") center / cover no-repeat fixed; }
    #profile { --ep-scene-image: url("../assets/elsewhere-desktop.webp"); }
    .ep-find { margin: 60px auto; max-width: 520px; border-radius: 18px; background: #ffffffc7; box-shadow: 0 18px 50px #0b2a4a40; }
    .ep-find { display: grid; justify-items: center; gap: 10px; padding: 70px 20px; color: #0b2a4a; font: 14px "Segoe UI", Tahoma, sans-serif; text-align: center; }
    .ep-find h1 { margin: 0; font-size: 26px; }
    .ep-find form { display: flex; gap: 6px; }
    .ep-find input { padding: 8px 10px; border: 1px solid #8aafd9; border-radius: 8px; font: inherit; min-width: 220px; }
    .ep-find button, .ep-find a { padding: 8px 14px; border: 1px solid #08419c; border-radius: 8px; color: #fff; font: inherit; font-weight: bold; text-decoration: none; cursor: pointer; background: linear-gradient(#acdfff 0%, #3e95f0 35%, #1260ca 65%, #0846ae 100%); }
    .ep-find p { margin: 0; max-width: 460px; color: #2b5677; }
  </style>
</head>
<body>
  <div id="profile" aria-live="polite"><p class="ep-state">Loading…</p></div>
  <script type="module" src="profile.js?v=2"></script>
</body>
</html>
