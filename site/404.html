<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>CyberStudios Wiki</title>
  <style>
    html, body { margin: 0; min-height: 100%; font: 15px "Segoe UI", Tahoma, sans-serif; color: #0b2a4a; background: #2f8fe0 url("/CyberStudios/assets/elsewhere-desktop.webp") center / cover no-repeat fixed; }
    main { max-width: 520px; margin: 80px auto; padding: 40px 24px; border-radius: 18px; text-align: center; background: #ffffffd0; box-shadow: 0 18px 50px #0b2a4a40; }
    a { color: #0b5fd0; font-weight: bold; }
  </style>
  <script>
    // Short profile links: /CyberStudios/@handle (and /@handle/page) open that Elsewhere profile.
    (function () {
      var m = /\/@([a-z0-9_.]{3,30})(?:\/([a-z0-9-]{1,30}))?\/?$/i.exec(location.pathname)
      if (m) location.replace('/CyberStudios/elsewhere/profile.html?u=' + encodeURIComponent(m[1].toLowerCase()) + (m[2] ? '&p=' + encodeURIComponent(m[2].toLowerCase()) : ''))
    })()
  </script>
</head>
<body>
  <main>
    <h1>☁ This page drifted away</h1>
    <p>We couldn’t find that page.</p>
    <p><a href="/CyberStudios/">Back to the CyberStudios Wiki</a></p>
  </main>
</body>
</html>
