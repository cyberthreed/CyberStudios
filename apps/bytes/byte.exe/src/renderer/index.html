<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self'; connect-src 'none'; font-src 'self'; base-uri 'none'; form-action 'none'; frame-src 'none'; object-src 'none'">
  <title>Byte Resident</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body class="pet-body" data-theme="haze">
  <p id="bubble" class="pet-bubble" aria-live="polite" hidden></p>
  <button id="pet" class="pet-button" aria-label="Pet Byte. Drag to move; right-click for menu." title="Click to pet · drag to move · right-click for snacks">
    <canvas id="sprite" width="256" height="256" aria-hidden="true"></canvas>
  </button>
  <nav class="pet-controls" aria-label="Byte controls"><button id="open-room" aria-label="Open Byte's room" title="Open room">⌂</button><button id="pet-quit" aria-label="Quit Byte" title="Quit Byte">×</button></nav>
  <script type="module" src="pet.mjs"></script>
</body>
</html>
