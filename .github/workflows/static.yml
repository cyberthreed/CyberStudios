
name: Deploy CyberStudios Wiki and Byte.exe

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy CyberStudios Website
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Assemble CyberStudios website
        run: |
          mkdir -p _pages/byte
          cp -a site/. _pages/
          cp -a apps/bytes/byte.exe/site/. _pages/byte/
          angels="ASCII art/the machine dreams of angels"
          mkdir -p "_pages/ascii-art/exhibition/00-the-machine-dreams-of-angels/outputs"
          cp "$angels/index.html" "_pages/ascii-art/exhibition/00-the-machine-dreams-of-angels/index.html"
          cp "$angels/outputs/page_frame.json" "_pages/ascii-art/exhibition/00-the-machine-dreams-of-angels/outputs/page_frame.json"

          test -f _pages/index.html
          test -f _pages/about/index.html
          test -f _pages/projects/index.html
          test -f _pages/docs/index.html
          test -f _pages/themes/index.html
          test -f _pages/themes/blender/index.html
          test -f _pages/themes/blender/gallery.html
          test -f _pages/ascii-art/index.html
          test -f _pages/ascii-art/exhibition/00-the-machine-dreams-of-angels/index.html
          test -f _pages/ascii-art/exhibition/00-the-machine-dreams-of-angels/outputs/page_frame.json
          test -f _pages/assets/ascii-art/angels-preview.png
          test -f _pages/themes/downloads/Cybercore_Cotton_Candy_Soft.xml
          test -f _pages/themes/downloads/Cybercore_Cotton_Candy_Vivid.xml
          test -f _pages/byte/index.html
          test -f _pages/byte/assets/icon.png

      - name: Upload complete website
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./_pages

      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
